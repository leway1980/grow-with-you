name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test "tests/*.test.mjs"
      - name: Lint (data, causal model, ending text)
        run: node tools/lint-data.mjs
      - name: Design check (mechanism health, caps, ending contradictions)
        run: node tools/check-design.mjs 3000
